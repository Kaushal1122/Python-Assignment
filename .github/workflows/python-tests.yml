
on:
  push:
    branches:
      - main
      - feat/mysql-generator
      - feat/person-gender
      - feat/remove-duplicates
      - feat/square-numbers
      - feat/anti-html
      - feat/python-unittest-exercise
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - mysql_generator
          - person_gender
          - remove_duplicates
          - square_numbers
          - anti_html
          - python-unittest-exercise-main

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=term-missing -v
